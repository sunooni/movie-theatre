#  https://lefthook.dev/configuration/

pre-push:
  jobs:
    - name: build
      run: npm run build

pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: oxlint --fix "{staged_files}"
      glob: '*.{js,ts,jsx,tsx}'
      stage_fixed: true
    - name: format
      run: oxfmt --write "{staged_files}"
      glob: '*.{js,ts,jsx,tsx}'